# Generated by `npx incident-kit init`. Docs: https://github.com/nuttakulsv/incident-kit
name: Incidents

on:
  issues:
    types: [opened, edited, closed, reopened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/30 * * * *' # reminders for quiet SEV1/SEV2 incidents
    - cron: '5 17 * * *' # daily status page refresh, 00:05 in Bangkok
  push:
    branches: [main]
    paths: [incident-kit.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: incident-kit-${{ github.event.issue.number || 'schedule' }}
  cancel-in-progress: false

jobs:
  incident:
    if: github.event_name != 'push' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    outputs:
      site-changed: ${{ steps.kit.outputs.site-changed }}
    steps:
      - uses: actions/checkout@v7
      - id: kit
        uses: nuttakulsv/incident-kit@v0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}

  status-page:
    needs: incident
    if: always() && (needs.incident.outputs.site-changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '5 17 * * *')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: nuttakulsv/incident-kit@v0
        with:
          command: build-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
