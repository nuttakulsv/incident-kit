# Generated by `npx incident-kit init` from incident-kit.yml. Run it again after you change the services.
name: Declare an incident
description: Start the incident process. The on-call commander is assigned automatically.
title: "[Incident] "
labels: [incident]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "SEV1 - Critical: Customers cannot use a core feature"
        - "SEV2 - Major: A core feature is degraded for many customers"
        - "SEV3 - Minor: Limited impact, or there is a workaround"
        - "SEV4 - Low: No customer impact yet"
    validations:
      required: true
  - type: dropdown
    id: services
    attributes:
      label: Affected services
      multiple: true
      options:
        - "Website"
        - "Public API"
        - "Payments"
        - "LINE notifications"
  - type: input
    id: public-title
    attributes:
      label: Public title
      description: What customers see on the status page. Leave empty to use the issue title.
  - type: textarea
    id: summary
    attributes:
      label: What is happening?
      description: What you know so far. This stays internal.
    validations:
      required: true
  - type: input
    id: impact-start
    attributes:
      label: When did the impact start?
      description: For example 2026-10-03 14:05, in Asia/Bangkok time
